<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  /* ── Variables ─────────────────────────────────────────── */
  :root {
    --bg:       #0d0e12;
    --surface:  #16181f;
    --border:   #252836;
    --accent:   #5b8dee;
    --accent2:  #a78bfa;
    --text:     #e2e4ec;
    --muted:    #7a7f96;
    --user-bg:  #1e2235;
    --bot-bg:   #151821;
    --danger:   #ef4444;
    --success:  #22c55e;
    --radius:   14px;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Noto Sans Hebrew', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: var(--sans); background: var(--bg); color: var(--text); }

  /* ── Auth Overlay ─────────────────────────────────────── */
  #auth-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); transition: opacity 0.4s;
  }
  #auth-overlay.hidden { opacity: 0; pointer-events: none; }
  .auth-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 2.5rem 3rem;
    width: min(380px, 90vw); text-align: center;
    box-shadow: 0 0 60px rgba(91,141,238,0.08);
  }
  .auth-card .lock-icon { font-size: 2.8rem; margin-bottom: 1rem; display: block; filter: drop-shadow(0 0 12px rgba(91,141,238,0.5)); }
  .auth-card h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.4rem; }
  .auth-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.6rem; }
  .auth-card input {
    width: 100%; padding: 0.75rem 1rem;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-family: var(--sans); font-size: 1rem;
    text-align: center; outline: none; transition: border-color 0.2s; direction: ltr;
  }
  .auth-card input:focus { border-color: var(--accent); }
  .auth-card input.error { border-color: var(--danger); }
  .auth-card button {
    margin-top: 1rem; width: 100%; padding: 0.75rem;
    border: none; border-radius: 10px; background: var(--accent); color: #fff;
    font-family: var(--sans); font-size: 1rem; font-weight: 500;
    cursor: pointer; transition: opacity 0.2s, transform 0.1s;
  }
  .auth-card button:hover { opacity: 0.85; }
  .auth-card .err-msg { margin-top: 0.75rem; color: var(--danger); font-size: 0.85rem; min-height: 1.2em; }

  /* ── Layout ───────────────────────────────────────────── */
  #app { display: flex; height: 100dvh; }

  /* ── Sidebar ──────────────────────────────────────────── */
  #sidebar {
    width: 240px; flex-shrink: 0;
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: transform 0.25s;
  }
  #sidebar.collapsed { transform: translateX(240px); position: absolute; right: 0; top: 0; height: 100%; z-index: 50; }

  .sidebar-header {
    padding: 1rem; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-header h2 { font-size: 0.88rem; color: var(--muted); font-weight: 500; }

  .sidebar-section { padding: 0.75rem; border-bottom: 1px solid var(--border); }
  .sidebar-section-title { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }

  /* Chats list */
  .chat-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.45rem 0.6rem; border-radius: 8px;
    cursor: pointer; font-size: 0.83rem; color: var(--muted);
    transition: all 0.15s; gap: 0.4rem;
  }
  .chat-item:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .chat-item.active { background: rgba(91,141,238,0.12); color: var(--accent); }
  .chat-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item-del {
    opacity: 0; font-size: 0.8rem; padding: 2px 5px;
    border-radius: 4px; background: transparent; border: none;
    color: var(--danger); cursor: pointer; transition: opacity 0.15s;
  }
  .chat-item:hover .chat-item-del { opacity: 1; }

  .sidebar-btn {
    width: 100%; padding: 0.45rem 0.6rem; margin-top: 0.3rem;
    background: transparent; border: 1px dashed var(--border);
    border-radius: 8px; color: var(--muted); font-family: var(--sans);
    font-size: 0.82rem; cursor: pointer; text-align: right;
    transition: all 0.15s;
  }
  .sidebar-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Memories list */
  .memory-item {
    font-size: 0.78rem; color: var(--muted); padding: 0.35rem 0.5rem;
    border-right: 2px solid var(--accent2); margin-bottom: 0.3rem;
    border-radius: 0 6px 6px 0; background: rgba(167,139,250,0.05);
    display: flex; align-items: flex-start; gap: 0.4rem;
  }
  .memory-item-text { flex: 1; line-height: 1.4; }
  .memory-del-btn {
    background: none; border: none; color: var(--danger);
    cursor: pointer; font-size: 0.75rem; padding: 0; opacity: 0.5; flex-shrink: 0;
  }
  .memory-del-btn:hover { opacity: 1; }

  /* Tone options */
  .tone-option {
    padding: 0.35rem 0.6rem; border-radius: 8px;
    cursor: pointer; font-size: 0.81rem; color: var(--muted);
    transition: all 0.15s; margin-bottom: 0.2rem;
  }
  .tone-option:hover { background: rgba(255,255,255,0.04); color: var(--text); }
  .tone-option.active { background: rgba(167,139,250,0.12); color: var(--accent2); }

  /* Stats */
  .stat-row { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 0.25rem 0; }
  .stat-label { color: var(--muted); }
  .stat-value { color: var(--text); font-weight: 500; }
  .stat-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 0.15rem; }
  .stat-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.5s; }

  /* Sidebar scroll */
  .sidebar-scroll { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  /* ── Main area ────────────────────────────────────────── */
  #main { display: flex; flex-direction: column; flex: 1; min-width: 0; }

  /* ── Header ───────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.85rem 1.2rem;
    background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo { font-size: 1.4rem; }
  header h1 { font-size: 1rem; font-weight: 600; flex: 1; }
  .header-badge {
    font-size: 0.72rem; padding: 0.22rem 0.6rem;
    background: rgba(91,141,238,0.12); color: var(--accent);
    border-radius: 999px; border: 1px solid rgba(91,141,238,0.25);
    max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .header-chat-badge {
    font-size: 0.72rem; padding: 0.22rem 0.6rem;
    background: rgba(167,139,250,0.1); color: var(--accent2);
    border-radius: 999px; border: 1px solid rgba(167,139,250,0.2);
    max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #sidebar-toggle {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); cursor: pointer; font-size: 1rem;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  #sidebar-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Model bar ────────────────────────────────────────── */
  .model-bar {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.6rem 1.2rem;
    background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
  }
  .model-bar::-webkit-scrollbar { display: none; }
  .model-label { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .model-btn {
    flex-shrink: 0; padding: 0.32rem 0.8rem;
    border: 1px solid var(--border); border-radius: 999px;
    background: transparent; color: var(--muted);
    font-family: var(--sans); font-size: 0.78rem;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .model-btn:hover { border-color: var(--accent); color: var(--accent); }
  .model-btn.active { border-color: var(--accent); background: rgba(91,141,238,0.12); color: var(--accent); font-weight: 500; }
  .model-btn.blocked { opacity: 0.35; cursor: not-allowed; }

  /* ── Messages ─────────────────────────────────────────── */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 1.5rem 1rem;
    display: flex; flex-direction: column; gap: 1rem;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex; gap: 0.75rem; align-items: flex-start;
    max-width: 820px; width: 100%;
    animation: fadeUp 0.25s ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg.user { flex-direction: row-reverse; margin-right: auto; }
  .msg.bot { margin-left: auto; }

  .msg-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0; border: 1px solid var(--border);
  }
  .msg.user .msg-avatar { background: rgba(91,141,238,0.15); }
  .msg.bot  .msg-avatar { background: rgba(167,139,250,0.12); }

  .msg-bubble {
    padding: 0.8rem 1rem; border-radius: var(--radius);
    line-height: 1.65; font-size: 0.92rem;
    max-width: 640px; border: 1px solid var(--border);
  }
  .msg.user .msg-bubble { background: var(--user-bg); border-radius: var(--radius) 4px var(--radius) var(--radius); }
  .msg.bot  .msg-bubble { background: var(--bot-bg); border-radius: 4px var(--radius) var(--radius) var(--radius); }
  .msg-meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.35rem; display: flex; gap: 0.5rem; align-items: center; }
  .msg-actions { display: flex; gap: 0.3rem; }
  .msg-action-btn {
    font-size: 0.7rem; padding: 2px 6px; border-radius: 4px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .msg-action-btn:hover { border-color: var(--accent); color: var(--accent); }

  .msg-bubble pre {
    background: #0a0b0f; border: 1px solid var(--border);
    border-radius: 8px; padding: 0.85rem;
    overflow-x: auto; margin-top: 0.5rem;
    font-family: var(--mono); font-size: 0.82rem;
    direction: ltr; text-align: left;
  }
  .msg-bubble code {
    font-family: var(--mono); font-size: 0.85em;
    background: rgba(255,255,255,0.07); border-radius: 4px; padding: 0.1em 0.35em;
  }
  .msg-bubble pre code { background: none; padding: 0; font-size: 1em; }

  .typing-dots span {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); margin: 0 2px; animation: bounce 1s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.30s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

  /* ── Toolbar ──────────────────────────────────────────── */
  .toolbar {
    display: flex; gap: 0.4rem; align-items: center;
    padding: 0.5rem 1.2rem;
    background: var(--surface); border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .toolbar-btn {
    padding: 0.28rem 0.65rem; border-radius: 6px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-family: var(--sans); font-size: 0.75rem;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .toolbar-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .toolbar-sep { color: var(--border); font-size: 0.9rem; padding: 0 0.1rem; }

  /* ── Input bar ─────────────────────────────────────────── */
  .input-bar {
    padding: 1rem 1.2rem;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; gap: 0.75rem; align-items: flex-end; flex-shrink: 0;
  }
  textarea#input {
    flex: 1; resize: none; overflow: hidden;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-family: var(--sans); font-size: 0.95rem;
    padding: 0.75rem 1rem; outline: none;
    min-height: 48px; max-height: 160px;
    transition: border-color 0.2s; line-height: 1.5;
  }
  textarea#input:focus { border-color: var(--accent); }
  textarea#input::placeholder { color: var(--muted); }
  #send-btn {
    width: 48px; height: 48px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s, transform 0.1s; flex-shrink: 0;
  }
  #send-btn:hover { opacity: 0.85; }
  #send-btn:active { transform: scale(0.94); }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  #send-btn svg { width: 20px; height: 20px; }

  /* ── Modal ─────────────────────────────────────────────── */
  .modal-bg {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-bg.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.8rem;
    width: min(420px, 92vw); max-height: 80vh; overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    transform: translateY(10px); transition: transform 0.2s;
  }
  .modal-bg.open .modal { transform: translateY(0); }
  .modal h3 { font-size: 1rem; margin-bottom: 1rem; }
  .modal input, .modal textarea {
    width: 100%; padding: 0.65rem 0.9rem;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    font-family: var(--sans); font-size: 0.9rem; outline: none;
    transition: border-color 0.2s;
  }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 0.6rem; margin-top: 1rem; }
  .modal-btn {
    flex: 1; padding: 0.6rem; border: none; border-radius: 8px;
    font-family: var(--sans); font-size: 0.9rem; cursor: pointer; transition: opacity 0.2s;
  }
  .modal-btn.primary { background: var(--accent); color: #fff; }
  .modal-btn.secondary { background: var(--border); color: var(--text); }
  .modal-btn:hover { opacity: 0.85; }

  /* ── Toast ─────────────────────────────────────────────── */
  #toast {
    position: fixed; bottom: 80px; right: 50%; transform: translateX(50%);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.6rem 1.2rem;
    font-size: 0.85rem; z-index: 300;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  #toast.success { border-color: var(--success); color: var(--success); }
  #toast.error { border-color: var(--danger); color: var(--danger); }

  /* ── Responsive ─────────────────────────────────────────── */
  @media (max-width: 700px) {
    #sidebar { position: absolute; right: 0; top: 0; height: 100%; z-index: 50; transform: translateX(240px); }
    #sidebar.open { transform: translateX(0); }
    header { padding: 0.7rem 1rem; }
    .auth-card { padding: 2rem 1.5rem; }
    .msg-bubble { font-size: 0.88rem; }
    .toolbar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<!-- ══ TOAST ══════════════════════════════════════════════════ -->
<div id="toast"></div>

<!-- ══ AUTH OVERLAY ════════════════════════════════════════════ -->
<div id="auth-overlay">
  <div class="auth-card">
    <span class="lock-icon">🔒</span>
    <h2>AI Chat</h2>
    <p>גישה פרטית — הכנס סיסמה כדי להמשיך</p>
    <input type="password" id="pw-input" placeholder="סיסמה" autocomplete="off"
           onkeydown="if(event.key==='Enter') doLogin()"/>
    <button onclick="doLogin()">כניסה</button>
    <div class="err-msg" id="err-msg"></div>
  </div>
</div>

<!-- ══ MODAL ════════════════════════════════════════════════════ -->
<div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-btns" id="modal-btns"></div>
  </div>
</div>

<!-- ══ APP ══════════════════════════════════════════════════════ -->
<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>תפריט</h2>
      <button id="sidebar-close" onclick="toggleSidebar()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;">✕</button>
    </div>
    <div class="sidebar-scroll">

      <!-- Chats -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">💬 צ'אטים</div>
        <div id="chats-list"></div>
        <button class="sidebar-btn" onclick="promptNewChat()">+ צ'אט חדש</button>
      </div>

      <!-- Memories -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">🧠 זיכרון</div>
        <div id="memories-list"></div>
        <button class="sidebar-btn" onclick="promptAddMemory()">+ הוסף זיכרון</button>
      </div>

      <!-- Tone -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">🎨 סגנון תשובות</div>
        <div id="tones-list"></div>
      </div>

      <!-- Stats -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">📊 סטטיסטיקות</div>
        <div id="stats-panel"></div>
      </div>

    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <header>
      <button id="sidebar-toggle" onclick="toggleSidebar()" title="תפריט">☰</button>
      <span class="logo">🤖</span>
      <h1>AI Chat</h1>
      <span class="header-chat-badge" id="chat-badge">ראשי</span>
      <span class="header-badge" id="model-badge">auto</span>
    </header>

    <div class="model-bar">
      <span class="model-label">מודל:</span>
      <button class="model-btn active" data-model="auto" onclick="selectModel('auto')">⚡ אוטומטי</button>
    </div>

    <div id="messages">
      <div class="msg bot" id="welcome-msg">
        <div class="msg-avatar">🤖</div>
        <div><div class="msg-bubble">שלום! אני כאן לעזור. במה אוכל לסייע לך? 😊</div></div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button class="toolbar-btn" onclick="doRetry()" id="btn-retry" title="שלח מחדש את ההודעה האחרונה">🔄 שלח מחדש</button>
      <span class="toolbar-sep">|</span>
      <button class="toolbar-btn" onclick="doUndo()" id="btn-undo">↩ ביטול</button>
      <button class="toolbar-btn" onclick="doRedo()" id="btn-redo">↪ שחזור</button>
      <span class="toolbar-sep">|</span>
      <button class="toolbar-btn" onclick="doSummarize()">📋 סיכום</button>
      <button class="toolbar-btn" onclick="doExport()">📤 ייצוא</button>
    </div>

    <div class="input-bar">
      <textarea id="input" placeholder="כתוב הודעה…" rows="1"
                onkeydown="handleKey(event)"
                oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()" title="שלח">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
// ══ CONFIG ══════════════════════════════════════════════════════
const API_BASE = "https://ai-telegram-bot-ikb0.onrender.com";

// ══ State ═══════════════════════════════════════════════════════
let sitePassword = "";
let selectedModel = "auto";
let chatHistory = [];
let isWaiting = false;
let activeChat = "ראשי";
let chats = { "ראשי": [] };      // chat_name → history array
let memories = [];                // array of strings
let currentTone = "רגיל";
let stats = { total_messages: 0, models: {}, first_use: null, last_use: null };
let undoStack = [];
let redoStack = [];
let currentAbortController = null;

const TONES = {
  "רגיל":    { desc: "ברירת מחדל — מאוזן",          prompt: "" },
  "קצר":     { desc: "תשובות קצרות וענייניות",        prompt: "ענה בקצרה ובתמציתיות. אל תרחיב מעבר לנחוץ." },

// ══ Auth ════════════════════════════════════════════════════════
async function doLogin() {
  const input = document.getElementById("pw-input");
  const errMsg = document.getElementById("err-msg");
  const btn = document.querySelector(".auth-card button");
  const pw = input.value.trim();
  if (!pw) { errMsg.textContent = "הכנס סיסמה"; return; }
  errMsg.textContent = "";
  input.classList.remove("error");

  // Loading state
  btn.disabled = true;
  btn.textContent = "מתחבר…";
  errMsg.style.color = "var(--muted)";
  errMsg.textContent = "מתחבר לשרת…";

  // אם לוקח יותר מ-4 שניות — השרת בוודאי ישן, הסבר למשתמש
  const wakeTimer = setTimeout(() => {
    errMsg.textContent = "⏳ השרת מתעורר, זה עשוי לקחת עד דקה…";
  }, 4000);

  try {
    const res = await fetch(`${API_BASE}/api/verify`, {
      method: "POST",
      headers: { "X-Site-Password": pw, "Content-Type": "application/json" }
    });
    clearTimeout(wakeTimer);
    if (res.ok) {
      sitePassword = pw;
      input.value = "";
      errMsg.textContent = "";
      document.getElementById("auth-overlay").classList.add("hidden");
      loadModels();
      renderSidebar();
    } else {
      input.classList.add("error");
      errMsg.style.color = "var(--danger)";
      errMsg.textContent = "סיסמה שגויה. נסה שוב.";
      input.focus();
    }
  } catch(e) {
    clearTimeout(wakeTimer);
    errMsg.style.color = "var(--danger)";
    errMsg.textContent = "❌ שגיאת חיבור לשרת.";
  } finally {
    btn.disabled = false;
    btn.textContent = "כניסה";
  }
}

// ══ Sidebar toggle ══════════════════════════════════════════════
function toggleSidebar() {
  const sb = document.getElementById("sidebar");
  if (window.innerWidth <= 700) {
    sb.classList.toggle("open");
  } else {
    sb.classList.toggle("collapsed");
  }
}

// ══ Models ══════════════════════════════════════════════════════
async function loadModels() {
  try {
    const res = await fetch(`${API_BASE}/api/models`);
    const models = await res.json();
    const bar = document.querySelector(".model-bar");
    const providers = [...new Set(models.map(m => m.provider))];
    providers.forEach(prov => {
      const group = models.filter(m => m.provider === prov);
      const sep = document.createElement("span");
      sep.style.cssText = "color:var(--border);font-size:0.9rem;padding:0 0.2rem;";
      sep.textContent = "|";
      bar.appendChild(sep);
      group.forEach(m => {
        const btn = document.createElement("button");
        btn.className = "model-btn" + (m.blocked ? " blocked" : "");
        btn.dataset.model = m.id;
        btn.textContent = m.heb;
        btn.title = m.id;
        if (!m.blocked) btn.onclick = () => selectModel(m.id);
        bar.appendChild(btn);
      });
    });
  } catch(e) {}
}

function selectModel(id) {
  selectedModel = id;
  document.querySelectorAll(".model-btn").forEach(b => b.classList.remove("active"));
  const btn = document.querySelector(`.model-btn[data-model="${id}"]`);
  if (btn) btn.classList.add("active");
  document.getElementById("model-badge").textContent = id;
}

// ══ Toast ════════════════════════════════════════════════════════
function showToast(msg, type = "") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show" + (type ? " " + type : "");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ""; }, 2500);
}

// ══ Chats ════════════════════════════════════════════════════════
function switchChat(name) {
  if (!chats[name]) chats[name] = [];
  // save current before switching
  chats[activeChat] = [...chatHistory];

  // אם יש בקשה פעילה — בטל אותה
  if (currentAbortController) {
    currentAbortController.abort();
    currentAbortController = null;
  }
  isWaiting = false;
  document.getElementById("send-btn").disabled = false;
  removeTypingIndicator();

  activeChat = name;
  chatHistory = [...chats[name]];
  undoStack = []; redoStack = [];
  renderMessages();
  renderSidebar();
  document.getElementById("chat-badge").textContent = name;
}

function promptNewChat() {
  openModal("צ'אט חדש", `<input id="modal-input" placeholder='שם הצ\'אט...' />`, [
    { label: "צור", cls: "primary", action: () => {
      const name = document.getElementById("modal-input").value.trim();
      if (!name) return;
      if (chats[name] !== undefined) { showToast("צ'אט כבר קיים", "error"); return; }
      chats[name] = [];
      closeModal();
      switchChat(name);
      showToast("✅ צ'אט נוצר: " + name, "success");
    }},
    { label: "ביטול", cls: "secondary", action: closeModal }
  ]);
  setTimeout(() => document.getElementById("modal-input")?.focus(), 50);
}

function deleteChat(name) {
  if (Object.keys(chats).length <= 1) { showToast("לא ניתן למחוק את הצ'אט האחרון", "error"); return; }
  openModal(`מחיקת '${name}'`, `<p style="color:var(--muted);font-size:0.9rem">האם למחוק את הצ'אט הזה? הפעולה בלתי הפיכה.</p>`, [
    { label: "מחק", cls: "primary", action: () => {
      delete chats[name];
      if (activeChat === name) switchChat(Object.keys(chats)[0]);
      else renderSidebar();
      closeModal();
      showToast("🗑 נמחק: " + name);
    }},
    { label: "ביטול", cls: "secondary", action: closeModal }
  ]);
}

// ══ Memories ═════════════════════════════════════════════════════
function promptAddMemory() {
  openModal("הוסף לזיכרון", `<input id="modal-input" placeholder='כתוב עובדה לזכור...' />`, [
    { label: "שמור", cls: "primary", action: () => {
      const fact = document.getElementById("modal-input").value.trim();
      if (!fact) return;
      if (memories.includes(fact)) { showToast("כבר שמור", "error"); return; }
      memories.push(fact);
      closeModal();
      renderSidebar();
      showToast("🧠 נשמר בזיכרון", "success");
    }},
    { label: "ביטול", cls: "secondary", action: closeModal }
  ]);
  setTimeout(() => document.getElementById("modal-input")?.focus(), 50);
}

function deleteMemory(idx) {
  memories.splice(idx, 1);
  renderSidebar();
  showToast("🗑 נמחק מהזיכרון");
}

// ══ Tone ═════════════════════════════════════════════════════════
function setTone(name) {
  currentTone = name;
  renderSidebar();
  showToast("🎨 סגנון: " + name, "success");
}

function getTonePrompt() {

}

// ══ Stats ════════════════════════════════════════════════════════
function trackUsage(modelName) {
  stats.total_messages++;
  stats.models[modelName] = (stats.models[modelName] || 0) + 1;
  const now = new Date().toLocaleString("he-IL");
  if (!stats.first_use) stats.first_use = now;
  stats.last_use = now;

}

// ══ Sidebar render ══════════════════════════════════════════════
function renderSidebar() {
  renderChats();
  renderMemories();
  renderTones();
  renderStats();
}

function renderChats() {
  const el = document.getElementById("chats-list");
  el.innerHTML = "";
  Object.keys(chats).forEach(name => {
    const div = document.createElement("div");
    div.className = "chat-item" + (name === activeChat ? " active" : "");
    div.innerHTML = `
      <span class="chat-item-name">${name === "ראשי" ? "🏠 " : "💬 "}${name}</span>
      <button class="chat-item-del" onclick="event.stopPropagation();deleteChat('${name}')">✕</button>`;
    div.onclick = () => switchChat(name);
    el.appendChild(div);
  });
}

function renderMemories() {
  const el = document.getElementById("memories-list");
  if (memories.length === 0) {
    el.innerHTML = '<div style="font-size:0.78rem;color:var(--muted);padding:0.3rem 0">אין זיכרונות שמורים</div>';

}

function renderTones() {
  const el = document.getElementById("tones-list");
  el.innerHTML = Object.entries(TONES).map(([name, info]) => `
    <div class="tone-option${currentTone === name ? " active" : ""}" onclick="setTone('${name}')">

function renderStats() {
  const el = document.getElementById("stats-panel");
  if (stats.total_messages === 0) {
    el.innerHTML = '<div style="font-size:0.78rem;color:var(--muted);padding:0.3rem 0">עדיין אין נתונים</div>';
    return;
  }
  const sorted = Object.entries(stats.models).sort((a,b) => b[1]-a[1]).slice(0, 5);
  let html = `
    <div class="stat-row"><span class="stat-label">📨 סה"כ הודעות</span><span class="stat-value">${stats.total_messages}</span></div>
    <div class="stat-row"><span class="stat-label">📅 ראשון</span><span class="stat-value" style="font-size:0.72rem">${stats.first_use||'—'}</span></div>
    <div class="stat-row"><span class="stat-label">🕐 אחרון</span><span class="stat-value" style="font-size:0.72rem">${stats.last_use||'—'}</span></div>
    <div style="margin-top:0.5rem;font-size:0.72rem;color:var(--muted);margin-bottom:0.25rem">מודלים:</div>`;
  sorted.forEach(([m, c]) => {
    const pct = Math.round(c / stats.total_messages * 100);
    html += `<div style="margin-bottom:0.4rem">
      <div class="stat-row"><span class="stat-label" style="font-size:0.75rem">${m}</span><span class="stat-value" style="font-size:0.75rem">${c} (${pct}%)</span></div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${pct}%"></div></div>

// ══ Messages render ═════════════════════════════════════════════
function renderMessages() {
  const msgs = document.getElementById("messages");
  msgs.innerHTML = "";
  if (chatHistory.length === 0) {
    msgs.innerHTML = `<div class="msg bot" id="welcome-msg"><div class="msg-avatar">🤖</div><div><div class="msg-bubble">שיחה חדשה! במה אוכל לעזור? 😊</div></div></div>`;
    return;
  }
  chatHistory.forEach((m, i) => {
    addMessageEl(m.role === "user" ? "user" : "bot", m.content, null, i);
  });
}

function formatText(text) {
  return text
    .replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${escHtml(c.trim())}</code></pre>`)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br/>");
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function addMessageEl(role, content, meta, idx) {
  const msgs = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  const avatar = role === "user" ? "👤" : "🤖";
  const metaHtml = meta ? `<div class="msg-meta">${meta}</div>` : "";
  const copyBtn = role === "bot"
    ? `<button class="msg-action-btn" onclick="copyText(this)" data-text="${escHtml(content)}">📋</button>`
    : "";
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div>
      <div class="msg-bubble">${formatText(content)}</div>
      ${metaHtml}
      <div class="msg-meta"><div class="msg-actions">${copyBtn}</div></div>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function addMessage(role, content, meta) {
  document.getElementById("welcome-msg")?.remove();
  return addMessageEl(role, content, meta);
}

function addTypingIndicator() {
  const msgs = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg bot"; div.id = "typing";
  div.innerHTML = `<div class="msg-avatar">🤖</div><div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}
function removeTypingIndicator() { document.getElementById("typing")?.remove(); }

function copyText(btn) {
  const text = btn.dataset.text;
  navigator.clipboard.writeText(text).then(() => showToast("📋 הועתק", "success"));
}

// ══ Undo / Redo ══════════════════════════════════════════════════
function pushUndo() {
  undoStack.push(chatHistory.map(m => ({...m})));
  if (undoStack.length > 20) undoStack.shift();
  redoStack = [];
}

function doUndo() {
  if (chatHistory.length === 0) { showToast("אין מה לבטל", "error"); return; }
  redoStack.push(chatHistory.map(m => ({...m})));
  if (undoStack.length > 0) {
    chatHistory = undoStack.pop();
  } else {
    // remove last pair
    if (chatHistory[chatHistory.length-1]?.role === "assistant") chatHistory.pop();
    if (chatHistory[chatHistory.length-1]?.role === "user") chatHistory.pop();
  }
  chats[activeChat] = [...chatHistory];
  renderMessages();
  showToast("↩ בוטל");
}

function doRedo() {
  if (redoStack.length === 0) { showToast("אין מה לשחזר", "error"); return; }
  undoStack.push(chatHistory.map(m => ({...m})));
  chatHistory = redoStack.pop();
  chats[activeChat] = [...chatHistory];
  renderMessages();
  showToast("↪ שוחזר");
}

// ══ Retry ════════════════════════════════════════════════════════
async function doRetry() {
  if (isWaiting) return;
  // find last user message
  let lastUserMsg = null;
  const history = [...chatHistory];
  while (history.length && history[history.length-1].role === "assistant") history.pop();
  if (history.length && history[history.length-1].role === "user") {
    lastUserMsg = history[history.length-1].content;
    history.pop();
  }
  if (!lastUserMsg) { showToast("אין הודעה קודמת", "error"); return; }

  pushUndo();
  chatHistory = history;
  chatHistory.push({ role: "user", content: lastUserMsg });
  chats[activeChat] = [...chatHistory];
  renderMessages();
  await sendToAPI(lastUserMsg, chatHistory.slice(0, -1));
}

// ══ Summarize ═════════════════════════════════════════════════════
async function doSummarize() {
  if (isWaiting) return;
  const userMsgs = chatHistory.filter(m => m.role === "user");
  if (userMsgs.length < 2) { showToast("צריך לפחות 2 הודעות לסיכום", "error"); return; }

  isWaiting = true;
  document.getElementById("send-btn").disabled = true;
  addTypingIndicator();

  let convoText = chatHistory.map(m => {
    const role = m.role === "user" ? "👤 משתמש" : "🤖 בוט";
    return `${role}: ${m.content}`;
  }).join("\n\n");

  const prompt = `סכם את השיחה הבאה בעברית בצורה תמציתית וברורה. כלול: נושאים עיקריים שנדונו, החלטות או מסקנות.\n\n${convoText}`;

  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Site-Password": sitePassword },
      body: JSON.stringify({ messages: [{ role: "user", content: prompt }], model: "llama-3.3-70b-versatile" })
    });
    removeTypingIndicator();
    if (res.status === 401) { sitePassword = ""; document.getElementById("auth-overlay").classList.remove("hidden"); return; }
    const data = await res.json();
    if (data.error) { addMessage("bot", `❌ ${data.error}`); }
    else { addMessage("bot", `📋 **סיכום השיחה:**\n\n${data.reply}`); }
  } catch(e) {
    removeTypingIndicator();
    addMessage("bot", "❌ שגיאת חיבור.");
  } finally {
    isWaiting = false;
    document.getElementById("send-btn").disabled = false;
  }
}

// ══ Export ═══════════════════════════════════════════════════════
function doExport() {
  if (chatHistory.length === 0) { showToast("אין מה לייצא", "error"); return; }

  // Ask which chat to export
  const chatNames = Object.keys(chats);
  let optionsHtml = chatNames.map(n => `<option value="${escHtml(n)}"${n === activeChat ? " selected" : ""}>${n}</option>`).join("");
  openModal("ייצוא צ'אט", `
    <select id="modal-input" style="width:100%;padding:0.6rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--sans)">
      ${optionsHtml}
    </select>`, [
    { label: "ייצא", cls: "primary", action: () => {
      const name = document.getElementById("modal-input").value;
      closeModal();
      exportChat(name);
    }},
    { label: "ביטול", cls: "secondary", action: closeModal }
  ]);
}

function exportChat(name) {
  const history = chats[name] || [];
  if (history.length === 0) { showToast("הצ'אט ריק", "error"); return; }
  const now = new Date().toLocaleString("he-IL");
  const userMsgs = history.filter(m => m.role === "user").length;
  let lines = [
    `ייצוא צ'אט: ${name}`,
    `תאריך: ${now}`,
    `הודעות: ${userMsgs}`,
    "=".repeat(40), ""
  ];
  history.forEach(m => {
    const role = m.role === "user" ? "👤 אתה" : "🤖 בוט";
    lines.push(`${role}:\n${m.content}\n`);
    lines.push("-".repeat(30));
    lines.push("");
  });
  const text = lines.join("\n");
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = name.replace(/[^a-z0-9א-ת\-_ ]/gi, "_");
  a.href = url; a.download = `chat_${safeName}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("📤 יוצא!", "success");
}

// ══ Send message ═════════════════════════════════════════════════
async function sendMessage() {
  if (isWaiting) return;
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; input.style.height = "48px";
  addMessage("user", text);
  pushUndo();
  chatHistory.push({ role: "user", content: text });
  chats[activeChat] = [...chatHistory];
  await sendToAPI(text, chatHistory.slice(0, -1));
}

async function sendToAPI(text, historyBeforeThis) {
  isWaiting = true;
  document.getElementById("send-btn").disabled = true;
  addTypingIndicator();

  // שמור את שם הצ'אט הפעיל כרגע
  const chatAtSend = activeChat;

  // צור controller לביטול
  currentAbortController = new AbortController();
  const signal = currentAbortController.signal;

  // Build messages with tone system hint if needed
  const tone = getTonePrompt();
  let messagesPayload = [...chatHistory];
  if (tone && messagesPayload.length > 0) {
    // append tone hint to last user message
    const last = messagesPayload[messagesPayload.length-1];
    if (last.role === "user" && !last._toned) {
      messagesPayload = [...messagesPayload.slice(0,-1), { role: last.role, content: last.content + (tone ? `\n\n[סגנון: ${tone}]` : "") }];
    }
  }

  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Site-Password": sitePassword },
      body: JSON.stringify({ messages: messagesPayload, model: selectedModel }),
      signal
    });

    removeTypingIndicator();

    if (res.status === 401) {
      sitePassword = "";
      document.getElementById("auth-overlay").classList.remove("hidden");
      return;
    }

    const data = await res.json();

    // שמור תמיד בצ'אט הנכון (גם אם המשתמש החליף)
    if (data.error) {
      chats[chatAtSend] = chats[chatAtSend] || [];
      if (chatAtSend === activeChat) addMessage("bot", `❌ ${data.error}`);
    } else {
      const modelUsed = data.model_used || selectedModel;
      const meta = data.model_used && (data.model_used !== selectedModel || selectedModel === "auto")
        ? `🤖 ${data.model_heb} (${data.model_used})`
        : null;

      // הוסף לhistory של הצ'אט שממנו נשלחה הבקשה
      const targetHistory = chats[chatAtSend] || [];
      targetHistory.push({ role: "assistant", content: data.reply });
      chats[chatAtSend] = targetHistory;

      if (chatAtSend === activeChat) {
        // המשתמש עדיין באותו צ'אט — הצג רגיל
        chatHistory = [...targetHistory];
        addMessage("bot", data.reply, meta);
      } else {
        // המשתמש עבר לצ'אט אחר — הודעה שקטה
        showToast(`💬 תגובה התקבלה ב‑${chatAtSend}`, "success");
      }

      if (chatAtSend === activeChat && chatHistory.length > 20)
        chatHistory = chatHistory.slice(-20);

      trackUsage(modelUsed);
    }
  } catch(e) {
    if (e.name === "AbortError") return; // בוטל בכוונה — לא להציג שגיאה
    removeTypingIndicator();
    if (chatAtSend === activeChat) addMessage("bot", "❌ שגיאת חיבור לשרת.");
  } finally {
    currentAbortController = null;
    isWaiting = false;
    document.getElementById("send-btn").disabled = false;
    document.getElementById("input").focus();
  }
}

// ══ Modal helpers ═════════════════════════════════════════════════
function openModal(title, bodyHtml, buttons) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = bodyHtml;
  const btns = document.getElementById("modal-btns");
  btns.innerHTML = "";
  buttons.forEach(b => {
    const btn = document.createElement("button");
    btn.className = `modal-btn ${b.cls}`;
    btn.textContent = b.label;
    btn.onclick = b.action;
    btns.appendChild(btn);
  });
  document.getElementById("modal-bg").classList.add("open");
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("modal-bg")) return;
  document.getElementById("modal-bg").classList.remove("open");
}

// ══ Utils ═════════════════════════════════════════════════════════
function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}

document.querySelector(".model-bar").addEventListener("wheel", function(e) {
  if (e.deltaY !== 0) { e.preventDefault(); this.scrollLeft += e.deltaY; }
}, { passive: false });

// ══ Init ═════════════════════════════════════════════════════════
renderSidebar();
</script>
