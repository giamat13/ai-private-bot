<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  /* ── Variables ─────────────────────────────────────────── */
  :root {
    --bg:       #0d0e12;
    --surface:  #16181f;
    --border:   #252836;
    --accent:   #5b8dee;
    --accent2:  #a78bfa;
    --text:     #e2e4ec;
    --muted:    #7a7f96;
    --user-bg:  #1e2235;
    --bot-bg:   #151821;
    --danger:   #ef4444;
    --success:  #22c55e;
    --radius:   14px;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Noto Sans Hebrew', sans-serif;
  }

  /* ── Reset ─────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: var(--sans); background: var(--bg); color: var(--text); }

  /* ── Auth Overlay ───────────────────────────────────────── */
  #auth-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    transition: opacity 0.4s;
  }
  #auth-overlay.hidden { opacity: 0; pointer-events: none; }

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem 3rem;
    width: min(380px, 90vw);
    text-align: center;
    box-shadow: 0 0 60px rgba(91,141,238,0.08);
  }
  .auth-card .lock-icon {
    font-size: 2.8rem; margin-bottom: 1rem;
    display: block;
    filter: drop-shadow(0 0 12px rgba(91,141,238,0.5));
  }
  .auth-card h2 {
    font-size: 1.3rem; font-weight: 600;
    margin-bottom: 0.4rem; color: var(--text);
  }
  .auth-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.6rem; }

  .auth-card input {
    width: 100%; padding: 0.75rem 1rem;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-family: var(--sans); font-size: 1rem;
    text-align: center; letter-spacing: 0.08em;
    outline: none; transition: border-color 0.2s;
    direction: ltr;
  }
  .auth-card input:focus { border-color: var(--accent); }
  .auth-card input.error { border-color: var(--danger); }

  .auth-card button {
    margin-top: 1rem; width: 100%;
    padding: 0.75rem; border: none; border-radius: 10px;
    background: var(--accent); color: #fff;
    font-family: var(--sans); font-size: 1rem; font-weight: 500;
    cursor: pointer; transition: opacity 0.2s, transform 0.1s;
  }
  .auth-card button:hover { opacity: 0.85; }
  .auth-card button:active { transform: scale(0.98); }
  .auth-card .err-msg {
    margin-top: 0.75rem; color: var(--danger);
    font-size: 0.85rem; min-height: 1.2em;
  }

  /* ── App Layout ─────────────────────────────────────────── */
  #app { display: flex; flex-direction: column; height: 100dvh; }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.85rem 1.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo { font-size: 1.5rem; }
  header h1 { font-size: 1.05rem; font-weight: 600; flex: 1; }
  .header-badge {
    font-size: 0.72rem; padding: 0.25rem 0.65rem;
    background: rgba(91,141,238,0.12); color: var(--accent);
    border-radius: 999px; border: 1px solid rgba(91,141,238,0.25);
  }

  /* ── Model selector ─────────────────────────────────────── */
  .model-bar {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.6rem 1.2rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0; overflow-x: auto;
    scrollbar-width: none;
  }
  .model-bar::-webkit-scrollbar { display: none; }
  .model-label { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }

  .model-btn {
    flex-shrink: 0; padding: 0.32rem 0.8rem;
    border: 1px solid var(--border); border-radius: 999px;
    background: transparent; color: var(--muted);
    font-family: var(--sans); font-size: 0.78rem;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .model-btn:hover { border-color: var(--accent); color: var(--accent); }
  .model-btn.active {
    border-color: var(--accent); background: rgba(91,141,238,0.12);
    color: var(--accent); font-weight: 500;
  }
  .model-btn.blocked { opacity: 0.35; cursor: not-allowed; }

  /* ── Messages ────────────────────────────────────────────── */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 1.5rem 1rem;
    display: flex; flex-direction: column; gap: 1rem;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex; gap: 0.75rem; align-items: flex-start;
    max-width: 820px; width: 100%;
    animation: fadeUp 0.25s ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg.user { flex-direction: row-reverse; margin-right: auto; margin-left: 0; }
  .msg.bot  { margin-left: auto; margin-right: 0; }

  .msg-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .msg.user .msg-avatar { background: rgba(91,141,238,0.15); }
  .msg.bot  .msg-avatar { background: rgba(167,139,250,0.12); }

  .msg-bubble {
    padding: 0.8rem 1rem;
    border-radius: var(--radius);
    line-height: 1.65; font-size: 0.92rem;
    max-width: 680px;
    border: 1px solid var(--border);
  }
  .msg.user .msg-bubble {
    background: var(--user-bg);
    border-radius: var(--radius) 4px var(--radius) var(--radius);
  }
  .msg.bot .msg-bubble {
    background: var(--bot-bg);
    border-radius: 4px var(--radius) var(--radius) var(--radius);
  }
  .msg-meta {
    font-size: 0.72rem; color: var(--muted); margin-top: 0.35rem;
  }

  /* code blocks inside messages */
  .msg-bubble pre {
    background: #0a0b0f; border: 1px solid var(--border);
    border-radius: 8px; padding: 0.85rem;
    overflow-x: auto; margin-top: 0.5rem;
    font-family: var(--mono); font-size: 0.82rem;
    direction: ltr; text-align: left;
  }
  .msg-bubble code {
    font-family: var(--mono); font-size: 0.85em;
    background: rgba(255,255,255,0.07); border-radius: 4px;
    padding: 0.1em 0.35em;
  }
  .msg-bubble pre code { background: none; padding: 0; font-size: 1em; }

  /* typing indicator */
  .typing-dots span {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; background: var(--muted);
    margin: 0 2px;
    animation: bounce 1s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.30s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

  /* ── Input bar ───────────────────────────────────────────── */
  .input-bar {
    padding: 1rem 1.2rem;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; gap: 0.75rem; align-items: flex-end;
    flex-shrink: 0;
  }
  textarea#input {
    flex: 1; resize: none; overflow: hidden;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-family: var(--sans); font-size: 0.95rem;
    padding: 0.75rem 1rem; outline: none;
    min-height: 48px; max-height: 160px;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  textarea#input:focus { border-color: var(--accent); }
  textarea#input::placeholder { color: var(--muted); }

  #send-btn {
    width: 48px; height: 48px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s, transform 0.1s;
    flex-shrink: 0;
  }
  #send-btn:hover { opacity: 0.85; }
  #send-btn:active { transform: scale(0.94); }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  #send-btn svg { width: 20px; height: 20px; }

  /* new chat button */
  #new-chat-btn {
    padding: 0; width: 36px; height: 36px;
    border: 1px solid var(--border); border-radius: 10px;
    background: transparent; color: var(--muted);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; flex-shrink: 0;
    font-size: 1.1rem;
  }
  #new-chat-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Responsive ─────────────────────────────────────────── */
  @media (max-width: 600px) {
    header { padding: 0.7rem 1rem; }
    .auth-card { padding: 2rem 1.5rem; }
    .msg-bubble { font-size: 0.88rem; }
  }
</style>
</head>
<body>

<!-- ══ AUTH OVERLAY ══════════════════════════════════════════ -->
<div id="auth-overlay">
  <div class="auth-card">
    <span class="lock-icon">🔒</span>
    <h2>AI Chat</h2>
    <p>גישה פרטית — הכנס סיסמה כדי להמשיך</p>
    <input type="password" id="pw-input" placeholder="סיסמה" autocomplete="off"
           onkeydown="if(event.key==='Enter') doLogin()"/>
    <button onclick="doLogin()">כניסה</button>
    <div class="err-msg" id="err-msg"></div>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════════════════ -->
<div id="app">
  <header>
    <span class="logo">🤖</span>
    <h1>AI Chat</h1>
    <span class="header-badge" id="model-badge">auto</span>
  </header>

  <div class="model-bar">
    <span class="model-label">מודל:</span>
    <button class="model-btn active" data-model="auto" onclick="selectModel('auto')">⚡ אוטומטי</button>
    <!-- More model buttons injected by JS -->
  </div>

  <div id="messages">
    <!-- Welcome message -->
    <div class="msg bot" id="welcome-msg">
      <div class="msg-avatar">🤖</div>
      <div>
        <div class="msg-bubble">שלום! אני כאן לעזור. במה אוכל לסייע לך? 😊</div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <button id="new-chat-btn" onclick="newChat()" title="שיחה חדשה">🗑️</button>
    <textarea id="input" placeholder="כתוב הודעה…" rows="1"
              onkeydown="handleKey(event)"
              oninput="autoResize(this)"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="שלח">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script>
// ══ CONFIG ══════════════════════════════════════════════════════
// ⚠️  Change this to your backend URL (Render / Railway / etc.)
const API_BASE = "https://ai-telegram-bot-ikb0.onrender.com";

// ══ State ═══════════════════════════════════════════════════════
let sitePassword = "";   // set after login; sent as a header — NEVER stored in DOM or localStorage
let selectedModel = "auto";
let chatHistory = [];    // [{role, content}, ...]
let isWaiting = false;

// ══ Auth ════════════════════════════════════════════════════════
async function doLogin() {
  const input = document.getElementById("pw-input");
  const errMsg = document.getElementById("err-msg");
  const pw = input.value.trim();
  if (!pw) { errMsg.textContent = "הכנס סיסמה"; return; }

  errMsg.textContent = "";
  input.classList.remove("error");

  try {
    const res = await fetch(`${API_BASE}/api/verify`, {
      method: "POST",
      headers: { "X-Site-Password": pw, "Content-Type": "application/json" }
    });
    if (res.ok) {
      sitePassword = pw;   // keep only in memory
      input.value = "";
      document.getElementById("auth-overlay").classList.add("hidden");
      loadModels();
    } else {
      input.classList.add("error");
      errMsg.textContent = "סיסמה שגויה. נסה שוב.";
      input.focus();
    }
  } catch (e) {
    errMsg.textContent = "שגיאת חיבור לשרת. ודא שה-backend פועל.";
  }
}

// ══ Models ══════════════════════════════════════════════════════
async function loadModels() {
  try {
    const res = await fetch(`${API_BASE}/api/models`);
    const models = await res.json();
    const bar = document.querySelector(".model-bar");

    // group by provider
    const providers = [...new Set(models.map(m => m.provider))];
    providers.forEach(prov => {
      const group = models.filter(m => m.provider === prov);
      const sep = document.createElement("span");
      sep.style.cssText = "color:var(--border);font-size:0.9rem;padding:0 0.2rem;";
      sep.textContent = "|";
      bar.appendChild(sep);
      group.forEach(m => {
        const btn = document.createElement("button");
        btn.className = "model-btn" + (m.blocked ? " blocked" : "");
        btn.dataset.model = m.id;
        btn.textContent = m.heb;
        btn.title = m.id;
        if (!m.blocked) btn.onclick = () => selectModel(m.id);
        bar.appendChild(btn);
      });
    });
  } catch(e) { /* ignore — models bar is optional */ }
}

function selectModel(id) {
  selectedModel = id;
  document.querySelectorAll(".model-btn").forEach(b => b.classList.remove("active"));
  const btn = document.querySelector(`.model-btn[data-model="${id}"]`);
  if (btn) btn.classList.add("active");
  document.getElementById("model-badge").textContent = id;
}

// ══ Chat ════════════════════════════════════════════════════════
function formatText(text) {
  // minimal markdown: bold, code blocks, inline code
  return text
    .replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${escHtml(c.trim())}</code></pre>`)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${escHtml(c)}</code>`)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br/>");
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function addMessage(role, content, meta) {
  const msgs = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  const avatar = role === "user" ? "👤" : "🤖";
  const metaHtml = meta ? `<div class="msg-meta">${meta}</div>` : "";
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div>
      <div class="msg-bubble">${formatText(content)}</div>
      ${metaHtml}
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function addTypingIndicator() {
  const msgs = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg bot"; div.id = "typing";
  div.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div><div class="msg-bubble">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTypingIndicator() {
  document.getElementById("typing")?.remove();
}

async function sendMessage() {
  if (isWaiting) return;
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  input.value = ""; input.style.height = ""; input.style.height = "48px";

  // remove welcome message on first send
  document.getElementById("welcome-msg")?.remove();

  addMessage("user", text);
  chatHistory.push({ role: "user", content: text });

  isWaiting = true;
  document.getElementById("send-btn").disabled = true;
  addTypingIndicator();

  try {
    const res = await fetch(`${API_BASE}/api/chat`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Site-Password": sitePassword   // ← password sent as header, never in URL or body
      },
      body: JSON.stringify({ messages: chatHistory, model: selectedModel })
    });

    removeTypingIndicator();

    if (res.status === 401) {
      // session expired — ask for password again
      sitePassword = "";
      document.getElementById("auth-overlay").classList.remove("hidden");
      return;
    }

    const data = await res.json();
    if (data.error) {
      addMessage("bot", `❌ ${data.error}`);
    } else {
      const meta = data.model_used !== selectedModel || selectedModel === "auto"
        ? `🤖 ${data.model_heb} (${data.model_used})`
        : null;
      addMessage("bot", data.reply, meta);
      chatHistory.push({ role: "assistant", content: data.reply });
      // keep last 20 messages to avoid huge payloads
      if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
    }
  } catch(e) {
    removeTypingIndicator();
    addMessage("bot", "❌ שגיאת חיבור לשרת.");
  } finally {
    isWaiting = false;
    document.getElementById("send-btn").disabled = false;
    input.focus();
  }
}

function newChat() {
  chatHistory = [];
  const msgs = document.getElementById("messages");
  msgs.innerHTML = `
    <div class="msg bot" id="welcome-msg">
      <div class="msg-avatar">🤖</div>
      <div><div class="msg-bubble">שיחה חדשה התחילה! במה אוכל לעזור? 😊</div></div>
    </div>`;
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}
</script>
</body>
</html>
